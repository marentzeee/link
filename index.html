
<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#100d20">

    <title>MARENTZE | Official Links</title>

    <meta name="description" content="MARENTZE - Official gaming and social links.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ANIMIRANA BRAWL STARS POZADINA -->

    <video class="background-video"
           autoplay
           muted
           loop
           playsinline>

        <source src="background.mp4" type="video/mp4">

    </video>

    <!-- TAMNI PREKRIVAC PREKO POZADINE -->

    <div class="background-overlay"></div>

    <!-- ANIMIRANE CESTICE -->

    <div class="particles"></div>


    <!-- GLAVNI SADRZAJ -->

    <main class="container">


        <!-- PROFIL -->

        <section class="profile">

            <div class="profile-image">

                <img
                    src="profile.png"
                    alt="MARENTZE profile"
                >

            </div>

            <!-- IME SE UCITAVA IZ SCRIPT.JS -->

            <h1 id="profile-name">MARENTZE</h1>

            <p class="subtitle">
                OFFICIAL SOCIAL LINKS
            </p>

            <div class="online-status">

                <span></span>

                ONLINE

            </div>

        </section>


        <!-- DRUSTVENE MREZE -->

        <section class="links-section">

            <h2>🌐 Društvene mreže</h2>

            <div
                id="social-links"
                class="social-links"
            >

                <!-- LINKOVI SE AUTOMATSKI DODAJU IZ SCRIPT.JS -->

            </div>

        </section>


        <!-- NAJNOVIJI YOUTUBE VIDEO -->

        <section class="video-section">

            <h2>🔥 NAJNOVIJI VIDEO</h2>

            <a
                id="latest-video"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="video-thumbnail">

                    <img
                        id="video-thumbnail"
                        src="thumbnail.jpg"
                        alt="MARENTZE latest video"
                    >

                    <div class="play-button">
                        ▶
                    </div>

                </div>

                <div class="video-info">

                    <span>
                        GLEDAJ MOJ ZADNJI VIDEO
                    </span>

                    <span class="video-arrow">
                        ↗
                    </span>

                </div>

            </a>

        </section>


        <!-- KONTAKT EMAIL -->

        <section class="contact-section">

            <h2>✉ CONTACT ME</h2>

            <a
                id="email-link"
                href="#"
            >

                ✉

                <span id="email-text">
                    Email
                </span>

            </a>

        </section>


        <!-- FOOTER -->

        <footer>

            <p>
                © 2026 <span id="footer-name">MARENTZE</span>
            </p>

            <p>
                MADE WITH ❤️
            </p>

        </footer>


    </main>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
